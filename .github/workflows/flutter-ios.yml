name: Flutter iOS Build & Sideload Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sideload IPA & Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Run Smoke Tests
        run: flutter test

      - name: Build iOS Release App (Device / No CodeSign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release -v 2>&1 | tee build.log

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "==================== XCODEBUILD / FLUTTER ERRORS ===================="
          grep -in -C 5 -E "error:|fatal error:|BUILD FAILED|The following build commands failed" build.log || true
          echo "==================== TAIL OF LOG ===================="
          tail -n 120 build.log
          
          # Create GitHub Annotation so it's visible in public check-runs API
          ERR_MSG=$(grep -i "error: " build.log | head -n 5 | tr '\n' ' ' | cut -c 1-500)
          if [ -n "$ERR_MSG" ]; then
            echo "::error title=XcodeBuildError::$ERR_MSG"
          fi
          
          # Push full error tail to git branch for direct inspection
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-log
          tail -n 400 build.log > build_error_tail.txt
          git add -f build_error_tail.txt
          git commit -m "chore: save build failure log" || true
          git push -f origin build-log || true

      - name: Build Apple Watch Companion App (watchOS)
        run: |
          echo "=== Building watchOS Companion App ==="
          mkdir -p build/watch_derived
          
          # 1. Try building with xcodebuild
          if xcodebuild -project ios/WatchApp/WatchApp.xcodeproj \
            -scheme WatchApp \
            -sdk watchos \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/watch_derived \
            build; then
            echo "WatchApp successfully built with xcodebuild!"
          else
            echo "Xcodebuild fallback: compiling watchOS binary directly with swiftc..."
            WATCH_APP_DIR="build/watch_derived/Build/Products/Release-watchos/WatchApp.app"
            mkdir -p "$WATCH_APP_DIR"
            xcrun -sdk watchos swiftc \
              -target arm64_32-apple-watchos9.0 \
              -parse-as-library \
              -emit-executable \
              -o "$WATCH_APP_DIR/WatchApp" \
              ios/WatchApp/MusicAssistantWatchApp.swift \
              ios/WatchApp/WatchContentView.swift \
              ios/WatchApp/WatchConnectivityManager.swift \
              ios/WatchApp/Views/WatchNowPlayingView.swift \
              ios/WatchApp/Views/WatchSpeakersView.swift \
              ios/WatchApp/Views/WatchDjView.swift
            cp ios/WatchApp/Info.plist "$WATCH_APP_DIR/Info.plist"
            echo "APPL????" > "$WATCH_APP_DIR/PkgInfo"
          fi
          
          ls -la build/watch_derived/Build/Products/Release-watchos/WatchApp.app || true

      - name: Extract App Version from Pubspec
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD=$(grep '^version: ' pubspec.yaml | cut -d '+' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "Release Version: $VERSION (Build $BUILD)"

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Embed Apple Watch companion app in Runner.app/Watch/
          WATCH_BUNDLE="build/watch_derived/Build/Products/Release-watchos/WatchApp.app"
          if [ -d "$WATCH_BUNDLE" ]; then
            echo "Embedding Apple Watch app inside Payload/Runner.app/Watch/..."
            mkdir -p Payload/Runner.app/Watch
            cp -r "$WATCH_BUNDLE" Payload/Runner.app/Watch/WatchApp.app
            echo "Watch app successfully embedded:"
            ls -la Payload/Runner.app/Watch/WatchApp.app
          else
            echo "Warning: Watch app bundle not found at $WATCH_BUNDLE"
          fi
          
          zip -qr music-assistant.ipa Payload
          cp music-assistant.ipa music-assistant-v${{ env.APP_VERSION }}.ipa
          ls -lh music-assistant*.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-ipa
          path: music-assistant.ipa

      - name: Publish Versioned Sideload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Music Assistant iOS v${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})"
          body: |
            ### 🎵 Music Assistant iOS v${{ env.APP_VERSION }} (Spotify Edition)
            Sideload-Release für **SideStore**, **AltStore** und **Sideloadly**.
            
            * **Version**: `v${{ env.APP_VERSION }}` (Build `${{ env.APP_BUILD }}`)
            * **Design**: 100% Spotify UI mit echtem OLED-Schwarz (`#000000`/`#121212`) und Spotify-Grün (`#1DB954`)
            * **Server**: Vorkonfiguriert für Music Assistant 2.0 (`http://192.168.188.25:8095`)
            * **Features & Highlights**:
              - 🎨 **Eigenes App-Icon (Spotify Edition)**: Speziell designtes, hochauflösendes iOS App-Icon mit tiefem OLED-Schwarz, konzentrischen Vinyl-Grooves und leuchtend grünem Spotify-Musik-Emblem in allen iOS- und Watch-Größen
              - 🏝️ **Echte Apple Dynamic Island & Live Activities (ActivityKit & WidgetKit)**: Native Hardware-Integration für iPhone 14 Pro, 15 und 16 – zeigt aktive Lautsprecher, pulsierende Soundwaves und DJ-Sprachblasen direkt in der Dynamic Island und auf dem Sperrbildschirm
              - 📲 **Autarker In-App-Updater (Keine Extra-App nötig)**: One-Tap-Installation und direktes In-App-Update über das native Apple OTA-Protokoll (`itms-services`) ohne SideStore, AltStore oder PC
              - 💾 **Offline Musik-Downloads & Speicher-Manager**: Lade einzelne Songs oder ganze Playlists herunter und genieße unterbrechungsfreie Musikwiedergabe komplett ohne Internetverbindung
              - ⌚ **Apple Watch Version & Companion App**: Vollständige watchOS-App (`ios/WatchApp`) in SwiftUI mit Now-Playing, Lautstärkeregelung über die Digital Crown, Multiroom-Lautsprecher-Auswahl und Spotify KI-DJ Vibe-Umschaltung direkt am Handgelenk
              - ⌚ **Apple Watch Remote & Live-Vorschau**: Integrierte, fotorealistische Apple Watch Fernbedienung direkt in der iOS-App zur Steuerung aller Multiroom-Speaker
              - 🎧 **Spotify Virtueller KI-DJ ("DJ X")**: Interaktiver DJ mit Sprachansagen (TTS über Music Assistant), 6 Stimmungen (*Allzeit-Favoriten*, *Rock-Klassiker*, *Vergessene Schätze*, *Entdeckungen*, *Party-Modus*, *Late Night*), pulsierendem Orb-Visualizer und automatischer Song-Zusammenstellung
              - 👤 **Profil- & Avatar-Verwaltung**: Eigenes Profilbild mit 8 kuratierten Spotify-Presets (DJ Pulse, Vinyl Master, Rock Star, etc.) oder individueller Bild-URL, persistiert im lokalen Speicher
              - 🔊 Automatische Raum-Lautsprecher-Auswahl ("Tim", "Wohnzimmer", Sonos) für volle Songlänge & Hi-Fi
              - 📱 iOS Hintergrund-Wiedergabe & Audio-Session Fix (kein Abbruch mehr beim Sperren des iPhones)
              - 💡 Intelligente Musik-Empfehlungen direkt auf dem Home Screen (Last.fm Ähnliche Titel & Künstler, Allzeit-Favoriten, Vergessene Schätze)
              - 🎙️ Vollständige Podcast-Integration (Shows, Episoden-Browser, Cover & Audio-Previews)
              - 🎚️ Direkte Server-Anbindung an das Music Assistant DSP-System (Presets wie *ARC Daily Punch*, *Airpods*, Preamp, parametrische Bänder)
              - 🌟 Neuer Spotify-Style Welcome & Anmelde-Screen (Benutzername & Passwort statt manueller API-Token)
              - 👥 Warteschlangen-Management mit Live-WebSocket-Sync
              - 🔊 Multiroom-Lautsprechersteuerung (Sonos, AirPlay, Shield, Chromecast, iPhone)
              - ⏱️ Sleep-Timer & TTS-Sprachansagen
            
            #### 📲 Installation:
            * **Direktes In-App-Update**: Tippe in den Einstellungen oder im Update-Dialog einfach auf *„Jetzt direkt in der App installieren“*. Keine weitere App erforderlich!
          files: |
            music-assistant.ipa
            music-assistant-v${{ env.APP_VERSION }}.ipa
            ios/ota_manifest.plist

      - name: Update Latest Sideload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Music Assistant iOS (Latest Sideload Release - v${{ env.APP_VERSION }})"
          body: |
            ### 🎵 Music Assistant iOS (Latest Build - v${{ env.APP_VERSION }})
            Dieses Release verweist immer auf die **aktuellste Version**.
            
            * **Aktuelle Version**: `v${{ env.APP_VERSION }}` (Build `${{ env.APP_BUILD }}`)
            * **Direkt-Download**: [music-assistant.ipa](https://github.com/LegoPuck-orginal/music-assistant-app/releases/download/latest/music-assistant.ipa)
          files: music-assistant.ipa
