name: Flutter iOS Build & Sideload Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sideload IPA & Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Run Smoke Tests
        run: flutter test

      - name: Build iOS Release App (Device / No CodeSign)
        run: flutter build ios --no-codesign --release

      - name: Extract App Version from Pubspec
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD=$(grep '^version: ' pubspec.yaml | cut -d '+' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "Release Version: $VERSION (Build $BUILD)"

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr music-assistant.ipa Payload
          cp music-assistant.ipa music-assistant-v${{ env.APP_VERSION }}.ipa
          ls -lh music-assistant*.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-ipa
          path: music-assistant.ipa

      - name: Publish Versioned Sideload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Music Assistant iOS v${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})"
          body: |
            ### 🎵 Music Assistant iOS v${{ env.APP_VERSION }} (Spotify Edition)
            Sideload-Release für **SideStore**, **AltStore** und **Sideloadly**.
            
            * **Version**: `v${{ env.APP_VERSION }}` (Build `${{ env.APP_BUILD }}`)
            * **Design**: 100% Spotify UI mit echtem OLED-Schwarz (`#000000`/`#121212`) und Spotify-Grün (`#1DB954`)
            * **Server**: Vorkonfiguriert für Music Assistant 2.0 (`http://192.168.188.25:8095`)
            * **Features & Highlights**:
              - ⌚ **Apple Watch Version & Companion App**: Vollständige watchOS-App (`ios/WatchApp`) in SwiftUI mit Now-Playing, Lautstärkeregelung über die Digital Crown, Multiroom-Lautsprecher-Auswahl und Spotify KI-DJ Vibe-Umschaltung direkt am Handgelenk
              - ⌚ **Apple Watch Remote & Live-Vorschau**: Integrierte, fotorealistische Apple Watch Fernbedienung direkt in der iOS-App zur Steuerung aller Multiroom-Speaker
              - 🎧 **Spotify Virtueller KI-DJ ("DJ X")**: Interaktiver DJ mit Sprachansagen (TTS über Music Assistant), 6 Stimmungen (*Allzeit-Favoriten*, *Rock-Klassiker*, *Vergessene Schätze*, *Entdeckungen*, *Party-Modus*, *Late Night*), pulsierendem Orb-Visualizer und automatischer Song-Zusammenstellung
              - 🏝️ **Apple Dynamic Island Integration**: Elegante, animierte Pille am oberen Bildschirmrand mit pulsierenden Soundwave-Balken, Live-DJ-Sprachblasen und Spring-Animation für erweiterte Schnellsteuerung
              - 👤 **Profil- & Avatar-Verwaltung**: Eigenes Profilbild mit 8 kuratierten Spotify-Presets (DJ Pulse, Vinyl Master, Rock Star, etc.) oder individueller Bild-URL, persistiert im lokalen Speicher
              - 🔊 Automatische Raum-Lautsprecher-Auswahl ("Tim", "Wohnzimmer", Sonos) für volle Songlänge & Hi-Fi
              - 📱 iOS Hintergrund-Wiedergabe & Audio-Session Fix (kein Abbruch mehr beim Sperren des iPhones)
              - 💡 Intelligente Musik-Empfehlungen direkt auf dem Home Screen (Last.fm Ähnliche Titel & Künstler, Allzeit-Favoriten, Vergessene Schätze)
              - 🎙️ Vollständige Podcast-Integration (Shows, Episoden-Browser, Cover & Audio-Previews)
              - 🎚️ Direkte Server-Anbindung an das Music Assistant DSP-System (Presets wie *ARC Daily Punch*, *Airpods*, Preamp, parametrische Bänder)
              - 🌟 Neuer Spotify-Style Welcome & Anmelde-Screen (Benutzername & Passwort statt manueller API-Token)
              - 📲 Integrierter In-App-Updater (Direkt-Installations-Links für SideStore / AltStore)
              - 👥 Warteschlangen-Management mit Live-WebSocket-Sync
              - 🔊 Multiroom-Lautsprechersteuerung (Sonos, AirPlay, Shield, Chromecast, iPhone)
              - ⏱️ Sleep-Timer & TTS-Sprachansagen
            
            #### 📲 Installation:
            * **SideStore / AltStore**: Tippe in der App auf *„Mit SideStore / AltStore installieren“* oder lade `music-assistant.ipa` herunter.
          files: |
            music-assistant.ipa
            music-assistant-v${{ env.APP_VERSION }}.ipa

      - name: Update Latest Sideload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Music Assistant iOS (Latest Sideload Release - v${{ env.APP_VERSION }})"
          body: |
            ### 🎵 Music Assistant iOS (Latest Build - v${{ env.APP_VERSION }})
            Dieses Release verweist immer auf die **aktuellste Version**.
            
            * **Aktuelle Version**: `v${{ env.APP_VERSION }}` (Build `${{ env.APP_BUILD }}`)
            * **Direkt-Download**: [music-assistant.ipa](https://github.com/LegoPuck-orginal/music-assistant-app/releases/download/latest/music-assistant.ipa)
          files: music-assistant.ipa
