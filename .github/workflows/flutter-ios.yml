name: Flutter iOS Build & Sideload Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sideload IPA & Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Run Smoke Tests
        run: flutter test

      - name: Build iOS Release App (Device / No CodeSign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release -v 2>&1 | tee build.log

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "==================== TAIL OF LOG ===================="
          tail -n 120 build.log
          echo "==================== XCODEBUILD / SWIFT / FLUTTER ERRORS ===================="
          grep -in -C 8 -E "error:|fatal error:|BUILD FAILED|The following build commands failed|AppDelegate\.swift" build.log || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B build-log
          grep -in -C 10 -E "error:|fatal error:|BUILD FAILED|The following build commands failed|AppDelegate\.swift" build.log > build_error_tail.txt || true
          tail -n 300 build.log >> build_error_tail.txt || true
          git add -f build_error_tail.txt
          git commit -m "chore: save build failure log" || true
          git push -f origin build-log || true

      - name: Extract App Version from Pubspec
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD=$(grep '^version: ' pubspec.yaml | cut -d '+' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "Release Version: $VERSION (Build $BUILD)"

      - name: Package Unsigned IPA for Sideloading
        run: |
          # 1. Erstelle die einzige saubere iOS IPA
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr music-assistant.ipa Payload
          ls -lh music-assistant.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-ipa
          path: music-assistant.ipa

      - name: Publish Single Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Music Assistant iOS v${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})"
          make_latest: true
          body: |
            ### 🎵 Music Assistant iOS v${{ env.APP_VERSION }} (Universal Edition)
            Offizielles Sideload-Release für **isideload**, **SideStore**, **AltStore** und **Sideloadly**.
            
            * **Version**: `v${{ env.APP_VERSION }}` (Build `${{ env.APP_BUILD }}`)
            * **Design**: Adobe Dark OLED Black (`#000000`/`#070707`) & Adobe Signature Orange (`#FF5C00`)
            * **Universal Network**: Automatisches Server-Scanning (Auto-Discovery), Verbindungs-Tester & Sofort-Start im Demo- & Offline-Modus
            * **Direkt-Download**: [music-assistant.ipa](https://github.com/LegoPuck-orginal/music-assistant-app/releases/download/v${{ env.APP_VERSION }}/music-assistant.ipa)
            * **Enthaltene Features**:
              - 📘 **Interaktiver Willkommens-Guide & Setup-Assistent**: Automatische Server-Erkennung, Connection-Test & Onboarding
              - 🏝️ **Native Apple Dynamic Island**: Echtes Hardware-Element mit animierten Audio-Equalizer-Wellen und Album-Cover
              - ⌚ **Native Apple Watch Anbindung**: Automatische „Jetzt läuft“-Anzeige auf der Apple Watch mit Digital Crown Lautstärkeregelung
              - 🔊 **Live Multiroom Speaker Monitor & 1-Tap Takeover**: Aktive Lautsprecher im Haus überwachen und Steuerung mit einem Klick übernehmen
              - 📚 **Hörbücher & Hörspiele (Die drei ???)**: Eigener Bereich mit Folgen-Übersicht, Sprecher-Cast und Kapitelliste
              - 🎤 **Live Synchronisierte Songtexte (Lyrics via LRCLIB)**: Taktgenaues Karaoke mit automatischem Mitscrollen
              - 🌊 **Interaktiver Audio-Waveform Scrubber**: 48 dynamische Klangwellenbalken mit Haptik
              - 📲 **Autarker In-App-Updater**: Direktdownload der IPA in der App & iOS Share-Sheet („In Dateien sichern“)
              - 🎛️ **Vollständiger 10-Band DSP Equalizer**: Fletcher-Munson Loudness & Genre-Profiling
              - 🎨 **Adobe Dark OLED Black App-Icon**
          files: |
            music-assistant.ipa
            ios/ota_manifest.plist
